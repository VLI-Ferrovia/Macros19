<title>Matriz de Naturezas</title>

<style>
/* Layout: busca fixa no topo; quatro cartões de classificação que também filtram; lista agrupada por grupo da matriz, cada natureza abre com a ação do CCE. */
:root{
  --bg:#EDF0F2; --surface:#FFFFFF; --line:#D3D9DF; --fg:#1A2128; --muted:#56626E; --band:#17607E; --band-fg:#FFFFFF;
  --qa-t:#8A5A00; --qa-d:#F2A516; --qa-bg:#FCEFD0;
  --inc-t:#1456A6; --inc-d:#1D7BE0; --inc-bg:#DDEBFB;
  --est-t:#1B6B3A; --est-d:#22A455; --est-bg:#DCF3E4;
  --pc-t:#A8231A; --pc-d:#D8312A; --pc-bg:#FBE0DD;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161B; --surface:#192026; --line:#2A333C; --fg:#E7EBEF; --muted:#97A3AF; --band:#1B6A8A; --band-fg:#FFFFFF;
    --qa-t:#F0B94B; --qa-d:#F2A516; --qa-bg:#35290E;
    --inc-t:#7DB4F2; --inc-d:#3C8CE8; --inc-bg:#14263E;
    --est-t:#6FD196; --est-d:#2DB566; --est-bg:#12301E;
    --pc-t:#FF8A80; --pc-d:#E8453D; --pc-bg:#3A1816;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11161B; --surface:#192026; --line:#2A333C; --fg:#E7EBEF; --muted:#97A3AF; --band:#1B6A8A; --band-fg:#FFFFFF;
  --qa-t:#F0B94B; --qa-d:#F2A516; --qa-bg:#35290E;
  --inc-t:#7DB4F2; --inc-d:#3C8CE8; --inc-bg:#14263E;
  --est-t:#6FD196; --est-d:#2DB566; --est-bg:#12301E;
  --pc-t:#FF8A80; --pc-d:#E8453D; --pc-bg:#3A1816;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font:400 15px/1.5 var(--body);
  padding-block:20px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:980px;margin:0 auto}
h1,h2,h3,p{margin:0}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

header.top{display:flex;flex-direction:column;gap:2px;padding-bottom:14px}
.eyebrow{font:600 12px/1.2 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font:700 40px/1.05 var(--display);letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}

.searchbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px 10px}
.search{position:relative}
.search input{
  width:100%;height:48px;padding:0 90px 0 16px;border:1.5px solid var(--line);border-radius:6px;
  background:var(--surface);font-size:16px;
}
.search input::placeholder{color:var(--muted)}
.search input:focus{border-color:var(--fg);outline:none}
.search kbd{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);font:500 12px var(--mono);
  color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px;pointer-events:none;
}

.classes{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-block:6px 16px}
.cls{
  text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:6px;padding:12px 14px 12px;
  display:flex;flex-direction:column;gap:6px;cursor:pointer;min-width:0;
}
.cls:hover{border-color:var(--muted)}
.cls[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.cls-head{display:flex;align-items:center;gap:8px}
.dot{width:12px;height:12px;border-radius:2px;flex:none;background:var(--c)}
.cls-name{font:700 18px/1.1 var(--display);letter-spacing:.02em;text-transform:uppercase;flex:1;min-width:0}
.cls-n{font:600 14px var(--mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.cls p{font-size:13.5px;line-height:1.4;color:var(--muted)}
.k-qa{--c:var(--qa-d);--t:var(--qa-t);--b:var(--qa-bg)}
.k-inc{--c:var(--inc-d);--t:var(--inc-t);--b:var(--inc-bg)}
.k-est{--c:var(--est-d);--t:var(--est-t);--b:var(--est-bg)}
.k-pc{--c:var(--pc-d);--t:var(--pc-t);--b:var(--pc-bg)}

.groups{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:thin}
.chip{
  flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px;
  font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;
}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.meta{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-block:8px 10px;color:var(--muted);font-size:14px}
.meta button{background:none;border:0;padding:0;color:var(--fg);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-weight:500}
.meta [hidden]{display:none}

.group{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;margin-bottom:18px}
.band{
  background:var(--band);color:var(--band-fg);border-radius:4px;display:flex;align-items:flex-start;justify-content:center;padding-block:12px;
}
.band span{writing-mode:vertical-rl;transform:rotate(180deg);font:700 15px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.items{display:flex;flex-direction:column;gap:6px;min-width:0}

.item{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:5px;min-width:0}
.head{
  width:100%;display:grid;grid-template-columns:54px minmax(0,1fr) auto 14px;align-items:center;gap:10px;
  background:none;border:0;padding:11px 12px 11px 10px;text-align:left;cursor:pointer;min-height:52px;
}
.head:hover{background:color-mix(in srgb,var(--fg) 4%,transparent)}
.code{font:600 15px var(--mono);font-variant-numeric:tabular-nums}
.nm{font-weight:600;font-size:16px;line-height:1.25;min-width:0;overflow-wrap:anywhere}
.pill{
  font:600 12.5px/1 var(--body);letter-spacing:.02em;padding:5px 9px;border-radius:4px;background:var(--b);color:var(--t);white-space:nowrap;
}
.caret{width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
.head[aria-expanded="true"] .caret{transform:rotate(-135deg)}

.detail{padding:4px 16px 16px 74px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px 28px;border-top:1px solid var(--line);margin-inline:0}
.detail[hidden]{display:none}
.col{display:flex;flex-direction:column;gap:12px;min-width:0;padding-top:12px}
.lbl{font:600 12px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.desc{overflow-wrap:anywhere}
.warn{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.warn li{padding:8px 10px;background:var(--b);color:var(--fg);border-radius:4px;font-size:14px;line-height:1.4;border-left:3px solid var(--c)}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:start}
.steps li::before{content:counter(s);font:700 15px/26px var(--display);text-align:center;width:26px;height:26px;border-radius:50%;background:var(--fg);color:var(--bg)}
.steps li span{padding-top:2px}
.sys{font-family:var(--mono);font-weight:600;font-size:13.5px}
.span2{grid-column:1 / -1;padding-top:0}
.notes{display:flex;flex-direction:column;gap:6px}
.notes textarea{
  width:100%;min-height:68px;resize:vertical;padding:9px 11px;border:1.5px solid var(--line);border-radius:5px;background:var(--bg);font-size:14.5px;line-height:1.4;
}
.notes textarea:focus{border-color:var(--fg);outline:none}
.row-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.btn{border:1.5px solid var(--fg);background:transparent;border-radius:5px;padding:6px 12px;font-weight:600;font-size:14px;cursor:pointer}
.btn:hover{background:var(--fg);color:var(--bg)}
.hint{font-size:13px;color:var(--muted)}

.empty{padding:40px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:6px}
.empty strong{display:block;color:var(--fg);font:700 22px var(--display);text-transform:uppercase;letter-spacing:.02em;margin-bottom:4px}
.foot{margin-top:24px;font-size:13px;color:var(--muted);max-width:68ch}

@media (max-width:640px){
  h1{font-size:34px}
  .group{grid-template-columns:22px minmax(0,1fr);gap:8px}
  .band span{font-size:13px}
  .head{grid-template-columns:44px minmax(0,1fr) 14px;row-gap:6px}
  .head .pill{grid-column:2;grid-row:2;justify-self:start}
  .head .caret{grid-column:3;grid-row:1}
  .detail{grid-template-columns:minmax(0,1fr);padding:4px 14px 16px 14px}
  .search kbd{display:none}
  .search input{padding-right:16px}
}
@media (prefers-reduced-motion:reduce){.caret{transition:none}}
</style>

    ['Eletroeletrônica','67','Autotrac','Avaria no Autotrac.','est',[]],
    ['Eletroeletrônica','68','Velocímetro','Avaria no velocímetro.','est',[]],
    ['Eletroeletrônica','69','Rádio','Avaria no rádio.','est',[]]
  ].map(function(r,i){
    return {id:i,group:r[0],code:r[1],name:r[2],desc:r[3],cls:r[4],warn:r[5]};
  });

  var GROUPS = [];
  D.forEach(function(d){ if(GROUPS.indexOf(d.group)<0) GROUPS.push(d.group); });

  var state = {q:'', cls:null, group:null, open:{0:true}};

  function norm(s){ return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(); }
  D.forEach(function(d){ d.hay = norm([d.code,d.name,d.desc,d.group,CLS[d.cls].label,d.warn.join(' ')].join(' ')); });

  function el(tag, cls, text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }

  function steps(d){
    var s = [];
    if(d.cls==='est'){
      s.push(['Abrir registro no sistema ', 'SAF', ', para fins estatísticos.']);
      s.push(['A legenda prevê só o registro, sem acionamento pelo CCE.','','']);
    } else {
      s.push(['O CCE aciona a área responsável por atuar na anomalia.','','']);
      if(d.cls==='inc') s.push(['O CCE abre registro no sistema ','SAF',', para fins estatísticos.']);
      else s.push(['O CCE abre registro no sistema ','Unigofer',' para apuração do QA.']);
    }
    return s;
  }

  function copyText(d){
    var t = d.code+' · '+d.name+' ('+d.group+')\nClassificação: '+CLS[d.cls].label+'\n';
    steps(d).forEach(function(s,i){ t += (i+1)+'. '+s.join('')+'\n'; });
    d.warn.forEach(function(w){ t += 'Atenção: '+w+'\n'; });
    return t.trim();
  }

  function buildItem(d){
    var item = el('article','item k-'+d.cls);
    var open = !!state.open[d.id];
    var head = el('button','head');
    head.type='button'; head.setAttribute('aria-expanded', open?'true':'false'); head.setAttribute('aria-controls','d'+d.id);
    head.appendChild(el('span','code',d.code));
    head.appendChild(el('span','nm',d.name));
    head.appendChild(el('span','pill',CLS[d.cls].pill));
    head.appendChild(el('span','caret'));
    var det = el('div','detail'); det.id='d'+d.id; det.hidden=!open;
    head.addEventListener('click', function(){
      var o = det.hidden; det.hidden = !o; state.open[d.id]=o; head.setAttribute('aria-expanded', o?'true':'false');
    });

    var c1 = el('div','col');
    var b1 = el('div'); b1.appendChild(el('div','lbl','Descrição')); b1.appendChild(el('p','desc',d.desc)); c1.appendChild(b1);
    var w = d.warn.slice();
    if(d.cls==='pc' && d.warn.indexOf(EMERG)<0 && d.code==='—'){ /* já tem aviso próprio */ }
    if(w.length){
      var b2 = el('div'); b2.appendChild(el('div','lbl','Atenção'));
      var ul = el('ul','warn'); w.forEach(function(x){ ul.appendChild(el('li',null,x)); }); b2.appendChild(ul); c1.appendChild(b2);
    }
    var c2 = el('div','col');
    var b3 = el('div'); b3.appendChild(el('div','lbl','O que fazer'));
    var ol = el('ol','steps');
    steps(d).forEach(function(s){
      var li = el('li'); var sp = el('span');
      sp.appendChild(document.createTextNode(s[0]));
      if(s[1]) sp.appendChild(el('span','sys',s[1]));
      if(s[2]) sp.appendChild(document.createTextNode(s[2]));
      li.appendChild(sp); ol.appendChild(li);
    });
    b3.appendChild(ol); c2.appendChild(b3);
    if(d.cls==='pc'){
      var b4 = el('div'); b4.appendChild(el('div','lbl','Potencial Crítico'));
      b4.appendChild(el('p',null,'Na tabela esta natureza consta como Quase Acidente e está marcada em vermelho como Potencial Crítico.'));
      c2.appendChild(b4);
    }
    if(d.code==='30'){
      var b5 = el('div'); b5.appendChild(el('div','lbl','Se houve emergência'));
      b5.appendChild(el('p',null,'A legenda inclui comunicação entre os descumprimentos que viram Potencial Crítico quando a emergência foi necessária.'));
      c2.appendChild(b5);
    }

    var c3 = el('div','col span2');
    var ra = el('div','row-actions');
    var cb = el('button','btn','Copiar resumo'); cb.type='button';
    var hint = el('span','hint','');
    cb.addEventListener('click', function(){
      var t = copyText(d);
      function ok(){ hint.textContent='Resumo copiado.'; }
      function fallback(){
        var tmp = el('textarea'); tmp.value=t; tmp.style.position='fixed'; tmp.style.opacity='0'; document.body.appendChild(tmp); tmp.select();
        var done=false; try{ done=document.execCommand('copy'); }catch(e){}
        document.body.removeChild(tmp);
        hint.textContent = done ? 'Resumo copiado.' : 'Não foi possível copiar. Selecione o texto manualmente.';
      }
      try { navigator.clipboard.writeText(t).then(ok, fallback); } catch(e){ fallback(); }
    });
    ra.appendChild(cb); ra.appendChild(hint); c3.appendChild(ra);

    det.appendChild(c1); det.appendChild(c2); det.appendChild(c3);
    item.appendChild(head); item.appendChild(det);
    return item;
  }

  function matches(d){
    if(state.cls && d.cls!==state.cls) return false;
    if(state.group && d.group!==state.group) return false;
    if(state.q){
      var terms = norm(state.q).split(/\s+/).filter(Boolean);
      for(var i=0;i<terms.length;i++){ if(d.hay.indexOf(terms[i])<0) return false; }
    }
    return true;
  }

  var listEl = document.getElementById('list');
  function renderList(){
    var rows = D.filter(matches);
    listEl.textContent='';
    var cnt = document.getElementById('count');
    cnt.textContent = rows.length+' de '+D.length+' naturezas';
    document.getElementById('clear').hidden = !(state.q||state.cls||state.group);
    if(!rows.length){
      var e = el('div','empty'); e.appendChild(el('strong',null,'Nenhuma natureza encontrada'));
      e.appendChild(el('span',null,'Tente o código (por exemplo 111) ou parte do nome. Os filtros de classificação e grupo também limitam a busca.'));
      listEl.appendChild(e); return;
    }
    GROUPS.forEach(function(g){
      var gr = rows.filter(function(d){ return d.group===g; });
      if(!gr.length) return;
      var sec = el('section','group');
      var band = el('div','band'); band.appendChild(el('span',null,g)); band.setAttribute('aria-hidden','true');
      var items = el('div','items'); items.setAttribute('role','group'); items.setAttribute('aria-label',g);
      gr.forEach(function(d){ items.appendChild(buildItem(d)); });
      sec.appendChild(band); sec.appendChild(items); listEl.appendChild(sec);
    });
  }

  var classesEl = document.getElementById('classes');
  function renderClasses(){
    classesEl.textContent='';
    ORDER.forEach(function(k){
      var n = D.filter(function(d){ return d.cls===k; }).length;
      var b = el('button','cls k-'+k); b.type='button'; b.setAttribute('aria-pressed', state.cls===k?'true':'false');
      var h = el('div','cls-head'); h.appendChild(el('span','dot')); h.appendChild(el('span','cls-name',CLS[k].label)); h.appendChild(el('span','cls-n',String(n)));
      b.appendChild(h); b.appendChild(el('p',null,CLS[k].rule));
      b.addEventListener('click', function(){ state.cls = state.cls===k ? null : k; renderClasses(); renderList(); });
      classesEl.appendChild(b);
    });
  }

  var groupsEl = document.getElementById('groups');
  function renderGroups(){
    groupsEl.textContent='';
    var all = el('button','chip','Todos os grupos'); all.type='button'; all.setAttribute('aria-pressed', state.group?'false':'true');
    all.addEventListener('click', function(){ state.group=null; renderGroups(); renderList(); });
    groupsEl.appendChild(all);
    GROUPS.forEach(function(g){
      var n = D.filter(function(d){ return d.group===g; }).length;
      var c = el('button','chip', g+' · '+n); c.type='button'; c.setAttribute('aria-pressed', state.group===g?'true':'false');
      c.addEventListener('click', function(){ state.group = state.group===g ? null : g; renderGroups(); renderList(); });
      groupsEl.appendChild(c);
    });
  }

  var q = document.getElementById('q');
  q.addEventListener('input', function(){ state.q = q.value.trim(); renderList(); });
  document.getElementById('clear').addEventListener('click', function(){
    state.q=''; state.cls=null; state.group=null; q.value=''; renderClasses(); renderGroups(); renderList();
  });
  document.addEventListener('keydown', function(e){
    if(e.key==='/' && document.activeElement!==q && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)){ e.preventDefault(); q.focus(); }
  });

  renderClasses(); renderGroups(); renderList();
})();
</script>

</body></html>
